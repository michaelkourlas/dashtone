[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
coreKtx = "1.18.0"
activity = "1.13.0"
appcompat = "1.7.1"
material = "1.14.0"
preference = "1.2.1"
junit = "4.13.2"
